<article class="post-card" data-category="{{ post.category | default: 'Engenharia' }}">
  <a class="card-image-link" href="{{ post.url | relative_url }}" tabindex="-1" aria-hidden="true"><img src="{{ post.image | default: '/assets/images/blog/design.svg' | relative_url }}" alt="" loading="lazy" width="800" height="500"></a>
  <div class="card-body"><div class="card-meta"><span>{{ post.category | default: 'Engenharia' }}</span><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%d/%m/%Y' }}</time></div><h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3><p>{{ post.description | default: post.excerpt | strip_html | truncate: 170 }}</p><a class="text-link" href="{{ post.url | relative_url }}">Ler artigo <span aria-hidden="true">↗</span><span class="sr-only">: {{ post.title }}</span></a></div>
</article>
