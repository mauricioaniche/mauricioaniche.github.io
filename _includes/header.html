<header class="site-header">
  <div class="wrapper header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}" aria-label="Maurício Aniche — {% if page.lang == 'en' %}home{% else %}início{% endif %}">maurício aniche<span class="brand-dot">.</span></a>
    <nav class="site-nav" aria-label="{% if page.lang == 'en' %}Main navigation{% else %}Navegação principal{% endif %}">
      {% if page.lang == 'en' %}
      <a href="#about">About</a>
      <a href="#books">Books</a>
      <a href="#research">Research</a>
      <a href="{{ '/english' | relative_url }}" lang="en" aria-current="page">In English</a>
      <a class="nav-cta" href="#mentoring">Mentoring <span aria-hidden="true">↗</span></a>
      {% else %}
      <a href="{{ '/#sobre' | relative_url }}">Sobre</a>
      <a href="{{ '/books' | relative_url }}" {% if page.url == '/books' %}aria-current="page"{% endif %}>Livros</a>
      <a href="{{ '/ia' | relative_url }}" {% if page.url == '/ia' %}aria-current="page"{% endif %}>IA</a>
      <a href="{{ '/conteudo' | relative_url }}" {% if page.url == '/conteudo' or page.content_type or page.url contains '/blog' or page.url contains '/publications' or page.url == '/podcasts-br' or page.url contains '/research' %}aria-current="page"{% endif %}>Conteúdo</a>
      <a href="{{ '/english' | relative_url }}" lang="en">In English</a>
      <a class="nav-cta" href="{{ '/mentoria' | relative_url }}" {% if page.url == '/mentoria' %}aria-current="page"{% endif %}>Mentoria <span aria-hidden="true">↗</span></a>
      {% endif %}
    </nav>
  </div>
</header>
