{% if include.item.tags contains 'ia' %}
<ul class="article-topics" aria-label="Assuntos do artigo">
  {% for topic_id in include.item.tags %}
    {% assign article_topic = site.data.ai_topics | where: 'id', topic_id | first %}
    {% if article_topic %}
    <li><a href="{{ '/ia' | relative_url }}?assunto={{ article_topic.id }}#artigos">{{ article_topic.label | escape }}</a></li>
    {% endif %}
  {% endfor %}
</ul>
{% endif %}
