{% if site.analytics.provider == 'ga4' and site.analytics.ga4_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.ga4_id | escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', {{ site.analytics.ga4_id | jsonify }});
</script>
{% elsif site.analytics.provider == 'umami' and site.analytics.umami_website_id and site.analytics.umami_script_url %}
<script defer src="{{ site.analytics.umami_script_url | escape }}" data-website-id="{{ site.analytics.umami_website_id | escape }}"></script>
{% endif %}
