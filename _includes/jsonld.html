{% if page.layout == 'post' or page.url == '/' or page.url == '/bio' %}
{% assign person_id = '/#person' | absolute_url %}
{% assign website_id = '/#website' | absolute_url %}
{% assign blog_id = '/blog#blog' | absolute_url %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": {{ person_id | jsonify }},
      "name": {{ site.author.name | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }},
      "image": {{ '/assets/images/foto-1-2026.jpg' | absolute_url | jsonify }},
      "jobTitle": "CTO",
      "worksFor": { "@type": "Organization", "name": "Alun" },
      "alumniOf": [{ "@type": "CollegeOrUniversity", "name": "Universidade de São Paulo", "url": "https://www.usp.br/" }],
      "sameAs": {{ site.author.same_as | jsonify }}
    },
    {
      "@type": "WebSite",
      "@id": {{ website_id | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }},
      "name": {{ site.title | jsonify }},
      "inLanguage": ["pt-BR", "en"],
      "publisher": { "@id": {{ person_id | jsonify }} }
    }
    {% if page.layout == 'post' %},
    {
      "@type": "Blog",
      "@id": {{ blog_id | jsonify }},
      "url": {{ '/blog' | absolute_url | jsonify }},
      "name": "Blog de Maurício Aniche",
      "isPartOf": { "@id": {{ website_id | jsonify }} },
      "author": { "@id": {{ person_id | jsonify }} }
    },
    {
      "@type": "BlogPosting",
      "@id": {{ canonical | append: '#article' | jsonify }},
      "url": {{ canonical | jsonify }},
      "headline": {{ page.title | jsonify }},
      "description": {{ description | jsonify }},
      "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
      "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
      "inLanguage": {{ page.lang | default: site.lang | jsonify }},
      "image": {{ share_image | jsonify }},
      "mainEntityOfPage": { "@type": "WebPage", "@id": {{ canonical | jsonify }} },
      "isPartOf": { "@id": {{ blog_id | jsonify }} },
      "author": { "@id": {{ person_id | jsonify }} },
      "publisher": { "@id": {{ person_id | jsonify }} }
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Início", "item": {{ '/' | absolute_url | jsonify }} },
        { "@type": "ListItem", "position": 2, "name": "Conteúdo", "item": {{ '/conteudo' | absolute_url | jsonify }} },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": {{ canonical | jsonify }} }
      ]
    }
    {% endif %}
  ]
}
</script>
{% endif %}
