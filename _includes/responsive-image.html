{%- assign responsive_image = site.data.responsive_images[include.src] -%}
<img src="{{ include.src | relative_url }}"{% if responsive_image %} srcset="{% for variant in responsive_image.variants %}{{ variant.url | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="{{ include.sizes | default: '(max-width: 800px) calc(100vw - 40px), 820px' | escape }}"{% endif %} alt="{{ include.alt | default: '' | escape }}" width="{{ responsive_image.width | default: include.width | default: 800 }}" height="{{ responsive_image.height | default: include.height | default: 500 }}"{% if include.class %} class="{{ include.class | escape }}"{% endif %}{% if include.loading %} loading="{{ include.loading }}"{% endif %}{% if include.fetchpriority %} fetchpriority="{{ include.fetchpriority }}"{% endif %}>
