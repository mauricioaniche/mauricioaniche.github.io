
# SEO settings
title: Maurício Aniche
description: "Maurício Aniche — engenharia de software, inteligência artificial, IA, liderança, livros e mentoria para Staff Engineers e diretores de engenharia."
lang: pt-BR
default_og: /assets/images/foto-1-2026.jpg
keywords: "mauricio aniche, aniche, alura, IA, AI, software engineering, research"
url: https://mauricioaniche.com

# Optional analytics: set analytics.provider and the matching IDs to enable.
analytics:
  provider: ga4
  ga4_id: G-GE39H77LMB
  umami_website_id: null
  umami_script_url: null

# Discovery
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# Publication times are midnight in São Paulo (03:00 UTC).
timezone: America/Sao_Paulo
future: false

# Build settings
markdown    : kramdown
highlighter : rouge
kramdown:
  input: GFM
  hard_wrap: false
  gfm_quirks: paragraph_end

collections:
  media:
    permalink: /conteudo/:title/
    output: true
  publications:
    permalink: /:collection/:title/
    output: true
  talks:
    permalink: /:collection/:title/
    output: true
  blog:
    permalink: /:collection/:title/
    output: true

defaults:
  - scope:
      path: ""
      type: "blog"
    values:
      content_type: blog
  - scope:
      path: ""
      type: "talks"
    values:
      layout: content-detail
      content_type: talks
      image: /assets/images/content/talk.svg
  - scope:
      path: ""
      type: "media"
    values:
      layout: content-detail
      content_type: podcasts
      image: /assets/images/content/podcast.svg
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
      content_type: publications

destination: _site

# Sass configuration
sass:
  sass_dir: assets/_sass
  style: compressed # expanded

# Author settings
author:
  name     : Maurício Aniche
  firstname: Maurício
  surname  : Aniche
  thumb    : /assets/images/photo.jpg
  email    : mauricioaniche@gmail.com
  url      : https://mauricioaniche.com
  github   : https://github.com/mauricioaniche
  twitter  : https://x.com/mauricioaniche
  linkedin : https://www.linkedin.com/in/mauricioaniche/

  same_as:
    - https://www.linkedin.com/in/mauricioaniche/
    - https://x.com/mauricioaniche
    - https://github.com/mauricioaniche
    - https://www.manning.com/authors/mauricio-aniche

exclude: ["vendor", "output", "scripts", "docs", "package-lock.json", "pagefind.yml", "gulp", "node_modules", "bower", "bower_components", "config.rb", "src", "Gemfile", "Gemfile.lock", ".rvmrc", ".rbenv-version", "package.json", "gulpfile.js", "README.md", "AGENTS.md", "Rakefile", "changelog.md"]
