
# SEO settings
title: Maurício Aniche
description: "Maurício Aniche — engenharia de software, inteligência artificial, IA, liderança, livros e mentoria para Staff Engineers e diretores de engenharia."
lang: pt-BR
keywords: "mauricio aniche, aniche, alura, IA, AI, software engineering, research"
url: https://www.mauricioaniche.com

google_analytics: UA-10934071-4

# Build settings
markdown    : kramdown
highlighter : rouge

collections:
  media:
    permalink: /conteudo/:title/
    output: true
  publications:
    permalink: /:collection/:title/
    output: true
  talks:
    permalink: /:collection/:title/
    output: true
  blog:
    permalink: /:collection/:title/
    output: true

defaults:
  - scope:
      path: ""
    values:
      featured: false
  - scope:
      path: ""
      type: "blog"
    values:
      content_type: blog
  - scope:
      path: ""
      type: "talks"
    values:
      layout: content-detail
      content_type: talks
      image: /assets/images/content/talk.svg
  - scope:
      path: ""
      type: "media"
    values:
      layout: content-detail
      content_type: podcasts
      image: /assets/images/content/podcast.svg
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
      content_type: publications

destination: _site

# Sass configuration
sass:
  sass_dir: assets/_sass
  style: compressed # expanded

# Author settings
author:
  name     : Maurício Aniche
  firstname: Maurício
  surname  : Aniche
  thumb    : /assets/images/photo.jpg
  email    : mauricioaniche@gmail.com
  url      : http://www.mauricioaniche.com
  github   : http://github.com/mauricioaniche
  twitter  : http://twitter.com/mauricioaniche
  linkedin : http://linkedin.com/in/mauricioaniche


exclude: ["gulp", "node_modules", "bower", "bower_components", "config.rb", "src", "Gemfile", "Gemfile.lock", ".rvmrc", ".rbenv-version", "package.json", "gulpfile.js", "README.md", "AGENTS.md", "Rakefile", "changelog.md"]
